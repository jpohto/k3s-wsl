apiVersion: v1
kind: Pod
metadata:
  name: pytorch-cuda
spec:
  restartPolicy: Never
  containers:
    - name: pytorch-cuda
      image: pytorch-cuda:latest
      imagePullPolicy: Never
      command:
        - python3
        - -c
        - |
          import torch;

          print(f"PyTorch version: {torch.__version__}"); 
          print(f"CUDA available: {torch.cuda.is_available()}"); 
          print(f"CUDA device name: {torch.cuda.get_device_name(0)}");
      resources:
        requests:
          cpu: "100m"
          memory: "128Mi"
        limits:
          cpu: "1"
          memory: "512Mi"
          nvidia.com/gpu: 1
